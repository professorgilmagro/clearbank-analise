<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0"/>
    </pattern>
    
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-box" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title -->
  <text x="450" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle">Pipeline de Processamento e Análise de Dados</text>

  <!-- Stage 1 Container -->
  <rect x="50" y="80" width="370" height="415" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <path d="M 50 92 A 12 12 0 0 1 62 80 L 408 80 A 12 12 0 0 1 420 92 L 420 130 L 50 130 Z" fill="url(#grad1)" />
  <text x="235" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Etapa 1: Processamento Nativo</text>

  <!-- Stage 2 Container -->
  <rect x="480" y="80" width="370" height="415" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <path d="M 480 92 A 12 12 0 0 1 492 80 L 838 80 A 12 12 0 0 1 850 92 L 850 130 L 480 130 Z" fill="url(#grad2)" />
  <text x="665" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Etapa 2: Análise com Pandas</text>


  <clipPath id="clip-b1">
    <rect x="105" y="155" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="105" y="155" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="105" y="155" width="6" height="46" fill="#38BDF8" clip-path="url(#clip-b1)" />
  <text x="125" y="183" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">📄 transacoes.csv</text>

  <clipPath id="clip-b2">
    <rect x="105" y="225" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="105" y="225" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="105" y="225" width="6" height="46" fill="#38BDF8" clip-path="url(#clip-b2)" />
  <text x="125" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">⚙️ Leitura e Validação de Dados</text>

  <clipPath id="clip-b3">
    <rect x="105" y="295" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="105" y="295" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="105" y="295" width="6" height="46" fill="#38BDF8" clip-path="url(#clip-b3)" />
  <text x="125" y="323" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">🧮 Cálculo de Métricas e Saldo</text>

  <clipPath id="clip-b4">
    <rect x="105" y="365" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="105" y="365" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="105" y="365" width="6" height="46" fill="#F43F5E" clip-path="url(#clip-b4)" />
  <text x="125" y="393" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">🚨 Detecção de Anomalias</text>

  <clipPath id="clip-b5">
    <rect x="105" y="435" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="105" y="435" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="105" y="435" width="6" height="46" fill="#10B981" clip-path="url(#clip-b5)" />
  <text x="125" y="463" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">📁 relatorio.json</text>

  <clipPath id="clip-b6">
    <rect x="535" y="155" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="535" y="155" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="535" y="155" width="6" height="46" fill="#818CF8" clip-path="url(#clip-b6)" />
  <text x="555" y="183" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">📄 transacoes.csv</text>

  <clipPath id="clip-b7">
    <rect x="535" y="225" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="535" y="225" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="535" y="225" width="6" height="46" fill="#818CF8" clip-path="url(#clip-b7)" />
  <text x="555" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">🧹 Processamento Otimizado (Pandas)</text>

  <clipPath id="clip-b8">
    <rect x="535" y="295" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="535" y="295" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="535" y="295" width="6" height="46" fill="#10B981" clip-path="url(#clip-b8)" />
  <text x="555" y="323" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">✅ Validação Cruzada dos Dados</text>

  <clipPath id="clip-b9">
    <rect x="535" y="365" width="260" height="46" rx="8" />
  </clipPath>
  <rect x="535" y="365" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-box)" />
  <rect x="535" y="365" width="6" height="46" fill="#A855F7" clip-path="url(#clip-b9)" />
  <text x="555" y="393" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">📊 Dashboards e Gráficos Visuais</text>
<line x1="235.0" y1="201" x2="235.0" y2="219" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="235.0" y1="271" x2="235.0" y2="289" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="235.0" y1="341" x2="235.0" y2="359" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="235.0" y1="411" x2="235.0" y2="429" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="665.0" y1="201" x2="665.0" y2="219" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="665.0" y1="271" x2="665.0" y2="289" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
<line x1="665.0" y1="341" x2="665.0" y2="359" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Dependency Arrow -->
  <path d="M 365 458 L 440 458 L 440 318 L 525 318" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)" />
  <rect x="403" y="306" width="85" height="24" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
  <text x="445" y="323" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Dependência</text>
</svg>